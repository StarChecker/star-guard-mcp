name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests
        run: node --test

  publish:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Секреты, вставленные вместе с переводом строки, ломают имя образа
      # (`user\n/star-guard-mcp` → невалидный тег `/star-guard-mcp:latest`).
      # Поэтому username обрезаем и валидируем, а не подставляем как есть.
      - name: Resolve Docker Hub namespace
        id: namespace
        if: github.event_name != 'pull_request'
        env:
          RAW_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          username="$(printf '%s' "$RAW_USERNAME" | tr -d '[:space:]')"
          token="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          if [ -z "$username" ]; then
            echo "::error::Repository secret DOCKERHUB_USERNAME is not set"
            exit 1
          fi
          if [ -z "$token" ]; then
            echo "::error::Repository secret DOCKERHUB_TOKEN is not set"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "name=${username,,}" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.namespace.outputs.name }}
          password: ${{ steps.namespace.outputs.token }}

      - name: Docker metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.namespace.outputs.name }}/star-guard-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=star-guard-mcp
            org.opencontainers.image.description=MCP server for Star Guard: deterministic suspicious-score interpretation
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: star-guard-mcp:pull-request
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
